spring:
  # Graceful shutdown: wait for in-flight requests to complete
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: honeycomb
  cloud:
    compatibility-verifier:
      enabled: false

server:
  shutdown: graceful
  # Limit in-memory buffer for request bodies to prevent OOM
  max-http-request-header-size: 16KB

spring.codec:
  max-in-memory-size: 1MB

service:
  discovery:
    base-url: "http://localhost"

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER:http://localhost:8761/eureka}"
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Example application properties for shared caller tests
app:
  test-caller: "test-client"

honeycomb:
  # Per-cell static discovery (uncomment to configure)
  # cell:
  #   addresses:
  #     SampleModel: "sample-service:8081,other-service:8082"
  #   ports:
  #     SampleModel: "8081,8082"
  # Storage backend for cell items: memory | redis | hibernate
  # storage:
  #   type: hibernate
  #   routing:
  #     enabled: true
  #     per-cell:
  #       SampleModel: redis
  #   hibernate:
  #     enabled: true
  #     url: "postgresql://localhost:5432/honeycomb"
  #     username: "honeycomb"
  #     password: "honeycomb"
  #     dialect: "org.hibernate.dialect.PostgreSQLDialect"
  #     hbm2ddl-auto: "update"
  #     show-sql: false
  #     pool-size: 10
  #     annotation-free: true
  # validation:
  #   enabled: true
  #   schema-dir: "schemas"
  #   fail-on-missing-schema: false
  #   per-cell:
  #     SampleModel: "SampleModel.schema.json"
  # idempotency:
  #   enabled: true
  #   store: "memory"   # memory | redis
  #   header: "Idempotency-Key"
  #   key-prefix: "honeycomb:idempotency"
  #   ttl-seconds: 300
  # Example: per-cell disabled operations
  # Use '*' key for global defaults
  disabled-operations:
    "__all__":
      - delete
    SampleModel:
      - create
  validation:
    enabled: true
    schema-dir: "schemas"
    fail-on-missing-schema: true
    per-cell:
      SampleModel: "SampleModel.schema.json"
      ExampleSharedService: "ExampleSharedService.schema.json"
  # WebClient timeouts
  webclient:
    connect-timeout-ms: 5000
    response-timeout-ms: 30000
  audit:
    max-entries: 500
  security:
    # require-auth: true
    api-keys:
      enabled: false
      header: "X-API-Key"
      keys:
        admin: "admin-key"
        cell: "cell-key"
      per-cell:
        "*": ["admin-key", "cell-key"]
    # jwt:
    #   enabled: true
    #   issuer-uri: "https://issuer.example.com/"
    #   jwk-set-uri: "https://issuer.example.com/.well-known/jwks.json"
    #   audience: "honeycomb-api"
    #   roles-claim: "roles"
    #   role-prefix: "ROLE_"
    #   scopes-claim: "scp"
    #   scope-prefix: "SCOPE_"
    #   shared-roles-claim: "shared_roles"
    #   shared-role-prefix: "ROLE_"
    #   default-roles: ["ROLE_USER"]
    #   per-cell-roles:
    #     "*": ["ROLE_USER"]
    #     SampleModel: ["ROLE_ADMIN"]
    #   per-cell-operation-roles:
    #     "*":
    #       read: ["ROLE_USER"]
    #       create: ["ROLE_ADMIN"]
    #     SampleModel:
    #       delete: ["ROLE_ADMIN"]
    #   shared-method-roles:
    #     "*": ["ROLE_USER"]
    #     discount: ["ROLE_PRICING"]
    # mtls:
    #   enabled: true
    #   require-client-cert: true
    #   allowed-subjects:
    #     - "CN=honeycomb-client,O=Example Corp,L=NYC,ST=NY,C=US"
  rate-limiter:
    enabled: true
    defaults:
      limit-for-period: 50
      refresh-period: 1s
      timeout: 0ms
    per-cell:
      SampleModel:
        limit-for-period: 100
        refresh-period: 1s
    # v1.5.0: Per-tenant rate limiting
    tenant-aware: false
    # per-tenant:
    #   tenant-a:
    #     limit-for-period: 200
    #     refresh-period: 1s
    #   tenant-b:
    #     limit-for-period: 50
    #     refresh-period: 1s
  routing:
    default-policy: "round-robin"
    per-cell-policy:
      "*": "round-robin"
    weights:
      SampleModel:
        "localhost:8081": 1
  events:
    enabled: true
    transport: memory            # memory | redis
    default-topic: honeycomb-events
    buffer-size: 256
  shared:
    cache:
      enabled: true
      warmup-enabled: true
      cache-refresh-ms: 60000
      type: local                # local | redis
      redis-key-prefix: "honeycomb:cache:"
      redis-invalidate-channel: "honeycomb:cache:invalidate"
      redis-ttl-seconds: 300
      sync-enabled: false
    methods:
      schema-validation-enabled: false
      policies:
        default:
          timeout: 5s
          retry-count: 1
          retry-backoff: 200ms
          circuit-breaker-enabled: true
        # Example method-version override
        # discount:v2:
        #   timeout: 2s
        #   retry-count: 2
        #   retry-backoff: 100ms
        #   circuit-breaker-enabled: true
  autoscale:
    enabled: false
    evaluation-interval: 30s
    scale-up-rps: 5.0
    scale-down-rps: 0.5
    per-cell-enabled:
      "*": true

  # v1.5.0: API versioning — prefix all endpoints with /v1/
  api:
    versioning-enabled: true
    current-version: v1
    legacy-paths-enabled: true
    version-header: X-API-Version

  # v1.5.0: OpenTelemetry distributed tracing
  tracing:
    enabled: true
    otlp-endpoint: "http://localhost:4318/v1/traces"
    sampling-probability: 1.0
    propagate-w3c: true
    enrich-spans: true
    service-name: honeycomb

  # v1.5.0: Secrets management (HashiCorp Vault)
  secrets:
    enabled: false
    provider: vault
    vault-path: "secret/honeycomb"
    fail-on-missing: false
    # refresh-interval: 5m
    # vault-role: honeycomb

  # v1.5.0: Adaptive circuit breaker
  circuit-breaker:
    adaptive-enabled: false
    initial-failure-rate-threshold: 50
    min-failure-rate-threshold: 20
    max-failure-rate-threshold: 80
    evaluation-window-size: 10
    adjustment-interval-seconds: 60
    wait-duration-in-open-state-seconds: 30
    sliding-window-size: 10
    permitted-calls-in-half-open: 5
    slow-call-duration-threshold-ms: 5000
    slow-call-rate-threshold: 80

# Shared invocation: caller header name to set by clients when invoking shared methods
shared:
  caller-header: "X-From-Cell"

# Actuator endpoints
management:
  endpoints:
    web:
      base-path: /honeycomb/actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: honeycomb
  # v1.5.0: Distributed tracing via OpenTelemetry
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: "http://localhost:4318/v1/traces"

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /honeycomb/api-docs
  swagger-ui:
    path: /honeycomb/swagger-ui.html
    operationsSorter: method
  show-actuator: false
