apiVersion: v1
kind: Service
metadata:
  name: {{ include "honeycomb.fullname" . }}
  labels:
    {{- include "honeycomb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.honeycomb.grpc.enabled }}
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    {{- include "honeycomb.selectorLabels" . | nindent 4 }}
