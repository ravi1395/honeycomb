apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: honeycombcells.honeycomb.io
  labels:
    app.kubernetes.io/part-of: honeycomb
spec:
  group: honeycomb.io
  names:
    kind: HoneycombCell
    listKind: HoneycombCellList
    plural: honeycombcells
    singular: honeycombcell
    shortNames:
      - hcell
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >
            HoneycombCell declares a cell workload. The Honeycomb operator
            translates each HoneycombCell into a Deployment, Service, and
            optional HPA.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - cellName
                - image
              properties:
                cellName:
                  type: string
                  description: Logical name of the cell (maps to @Cell("name"))
                image:
                  type: string
                  description: Container image for the cell
                version:
                  type: string
                  description: Cell version label (e.g. v1, v2)
                  default: "v1"
                replicas:
                  type: integer
                  description: Desired replica count
                  default: 1
                  minimum: 0
                port:
                  type: integer
                  description: HTTP port the cell listens on
                  default: 8080
                grpcPort:
                  type: integer
                  description: gRPC port (0 = disabled)
                  default: 0
                resources:
                  type: object
                  description: Resource requests and limits
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "250m"
                        memory:
                          type: string
                          default: "512Mi"
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "1"
                        memory:
                          type: string
                          default: "1Gi"
                autoscaling:
                  type: object
                  description: HPA configuration
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      default: 1
                    maxReplicas:
                      type: integer
                      default: 10
                    targetCPU:
                      type: integer
                      description: Target CPU utilization percentage
                      default: 70
                env:
                  type: array
                  description: Additional environment variables
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                availableReplicas:
                  type: integer
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Degraded
                    - Failed
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cell
          type: string
          jsonPath: .spec.cellName
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
